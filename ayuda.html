<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayuda y Contacto</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.telefono{
    width:350px;
    background:white;
    border:8px solid #222;
    border-radius:35px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    color:#0d4e96;
    margin-bottom:20px;
}

.tarjeta{
    background:#f0f0f0;
    border-radius:10px;
    padding:15px;
    margin:10px 0;
}

.tarjeta h3{
    color:#4CAF50;
    margin-bottom:8px;
}

p{
    color:#444;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

.regresar{
    background:#0d4e96;
}

button:hover{
    opacity:.9;
}

</style>
</head>
<body>

<div class="telefono">

    <h1>Ayuda y Contacto</h1>

    <div class="tarjeta">
        <h3>📞 Línea de ayuda</h3>
        <p>800-123-4567</p>
    </div>

    <div class="tarjeta">
        <h3>💬 WhatsApp</h3>
        <p>55-1234-5678</p>
    </div>

    <div class="tarjeta">
        <h3>❓ Preguntas frecuentes</h3>
        <p>Consulta dudas sobre vacunas y citas.</p>
    </div>

    <div class="tarjeta">
        <h3>🩺 Reporte de efectos secundarios</h3>
        <p>Comunícate con un asesor especializado.</p>
    </div>

    <div class="tarjeta">
        <h3>🚨 Emergencias</h3>
        <p>911</p>
    </div>

    <button class="regresar"
    onclick="window.location.href='inicio.html'">
        REGRESAR
    </button>

</div>

</body>
</html>
