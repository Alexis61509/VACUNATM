<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio de Sesión</title>

<style>

body{
    background:linear-gradient(135deg,#0d4e96,#3cb371);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
}

.login{
    background:white;
    width:350px;
    padding:40px;
    border-radius:20px;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    color:white;
    margin-top:10px;
    cursor:pointer;
}

.ingresar{
    background:#3cb371;
}

.registrar{
    background:#0d4e96;
}

h1{
    color:#0d4e96;
}

span{
    color:#3cb371;
}

</style>
</head>

<body>

<div class="login">

    <h1>VACÚNATE <span>MX</span></h1>

    <h2>Inicio de Sesión</h2>

    <input type="text" id="usuario" placeholder="Usuario">

    <input type="password" id="password" placeholder="Contraseña">

    <button class="ingresar" onclick="ingresar()">
        Ingresar
    </button>

    <button class="registrar" onclick="registrarse()">
        Registrarse
    </button>

</div>

<script>

function registrarse(){

    let nuevoUsuario = prompt("Escribe tu nuevo usuario:");
    let nuevaPassword = prompt("Escribe tu contraseña:");

    if(nuevoUsuario && nuevaPassword){

        localStorage.setItem("usuario", nuevoUsuario);
        localStorage.setItem("password", nuevaPassword);

        alert("Usuario registrado correctamente");
    }
}

function ingresar(){

    let usuario = document.getElementById("usuario").value;
    let password = document.getElementById("password").value;

    let usuarioGuardado = localStorage.getItem("usuario");
    let passwordGuardada = localStorage.getItem("password");

    if(
        (usuario=="admin" && password=="12345") ||
        (usuario==usuarioGuardado &&
         password==passwordGuardada)
    ){

        location.href="inicio.html";

    }else{

        alert("Usuario o contraseña incorrectos");
    }
}

</script>

</body>
</html>
